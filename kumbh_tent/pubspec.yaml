name: kumbh_tent
description: "Bharat Tent — Kumbh pilgrimage tent booking."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.2

  # Navigation
  go_router: ^17.3.0

  # Network
  dio: ^5.4.0

  # Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0

  # Maps & Location
  google_maps_flutter: ^2.6.0
  geolocator: ^14.0.3

  # UI
  google_fonts: ^8.2.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Booking features
  table_calendar: ^3.1.0
  qr_flutter: ^4.1.0

  # Payment
  # Image
  image_picker: ^1.0.7
  gal: ^2.3.0
  # Lets the Aadhaar-doc picker take either a photo/gallery image
  # (image_picker) or, on the same button, an existing PDF scan —
  # image_picker alone can't reach PDFs.
  file_picker: ^13.1.0

  # Utils
  intl: ^0.20.3
  http: ^1.6.0

  share_plus: ^13.2.1
  url_launcher: ^6.2.5
  path_provider: ^2.1.2

  # Firebase
  firebase_core: 4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.0.1

  # Razorpay: 3.x drops the old Android "Registrar" API that broke the
  # Android build on newer Flutter (2.0.2 fails to compile).
  razorpay_web: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# razorpay_web 3.x pins an older package_info_plus than geolocator 14.0.3+
# (via geolocator_linux) needs. Razorpay only reads the app version from it,
# so force the newer one. Remove once razorpay_web supports package_info_plus 10.
dependency_overrides:
  package_info_plus: ^10.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FAF3E8"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/images/regular capsule tent.png
    - assets/images/regular all view.png
    - assets/images/regular inside view.png
    - assets/images/regular inside view2.png
    - assets/images/regular inside wiev.png
    - assets/images/luxury Capsule tent.png
    - assets/images/luxury all image.png
    - assets/images/luxury inside img.png
    - assets/images/luxury inside view.png
    - assets/images/luxury inside view2.png
    - assets/images/premium capsule tent.png
    - assets/images/premium all view.png
    - assets/images/premium inside view.png
    - assets/images/premium inside view2.png
    - assets/images/premium .png
    - assets/logo/
    - assets/history/ 