services:

  # ── PostgreSQL (local dev only — AWS uses RDS via DATABASE_URL) ──
  postgres:
    image: postgres:15-alpine
    container_name: kumbh_postgres
    profiles: ["local"]
    # Every other service is unless-stopped; without it here the DB
    # stayed down after a Docker daemon restart and took the whole
    # stack with it (services crash-loop on "lookup postgres").
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kumbh_tent
    ports:
      - "0.0.0.0:${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # initdb runs these in lexical order, so schema.sql must
      # sort before the migrations. Prefixed accordingly.
      - ./schema.sql:/docker-entrypoint-initdb.d/00_schema.sql
      - ./migrations/001_create_refunds.sql:/docker-entrypoint-initdb.d/01_refunds.sql
      - ./migrations/002_missing_tables.sql:/docker-entrypoint-initdb.d/02_missing_tables.sql
      - ./migrations/003_refund_approval.sql:/docker-entrypoint-initdb.d/03_refund_approval.sql
      - ./migrations/004_cancellation_policy.sql:/docker-entrypoint-initdb.d/04_cancellation_policy.sql
      # BUG-25: 005-015 existed as files but were never mounted, so a
      # fresh dev DB (or a fresh RDS instance) never got the finance,
      # payment-tracking, invoicing, ledger, RBAC/audit, vendor-payables
      # or perf-index tables the Go code already queries — every one of
      # these would 42P01 ("relation does not exist") on a clean deploy.
      - ./migrations/005_finance_phase1.sql:/docker-entrypoint-initdb.d/05_finance_phase1.sql
      - ./migrations/006_payment_tracking.sql:/docker-entrypoint-initdb.d/06_payment_tracking.sql
      - ./migrations/007_expenses_multicurrency.sql:/docker-entrypoint-initdb.d/07_expenses_multicurrency.sql
      - ./migrations/008_gateway_reconciliation.sql:/docker-entrypoint-initdb.d/08_gateway_reconciliation.sql
      - ./migrations/009_invoicing.sql:/docker-entrypoint-initdb.d/09_invoicing.sql
      - ./migrations/010_ledger_bank_reports.sql:/docker-entrypoint-initdb.d/10_ledger_bank_reports.sql
      - ./migrations/011_rbac_audit.sql:/docker-entrypoint-initdb.d/11_rbac_audit.sql
      - ./migrations/012_vendor_payables.sql:/docker-entrypoint-initdb.d/12_vendor_payables.sql
      - ./migrations/013_refund_approval_reason.sql:/docker-entrypoint-initdb.d/13_refund_approval_reason.sql
      - ./migrations/014_push_notifications.sql:/docker-entrypoint-initdb.d/14_push_notifications.sql
      - ./migrations/015_perf_indexes.sql:/docker-entrypoint-initdb.d/15_perf_indexes.sql
      - ./migrations/016_payment_integrity.sql:/docker-entrypoint-initdb.d/16_payment_integrity.sql
      - ./migrations/017_rate_limits.sql:/docker-entrypoint-initdb.d/17_rate_limits.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API Gateway ──────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: kumbh_gateway
    ports:
      - "0.0.0.0:${GATEWAY_PORT:-8085}:8080"
    environment:
      - API_GATEWAY_PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:8081
      - TENT_SERVICE_URL=http://tent-service:8082
      - BOOKING_SERVICE_URL=http://booking-service:8083
      - PAYMENT_SERVICE_URL=http://payment-service:8084
      - JWT_SECRET=${JWT_SECRET:-dev-only-insecure-secret}
    depends_on:
      - auth-service
      - tent-service
      - booking-service
      - payment-service
    restart: unless-stopped

  # ── Auth Service ──────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: kumbh_auth
    ports:
      - "0.0.0.0:8081:8081"
    environment:
      - AUTH_SERVICE_PORT=8081
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:password@postgres:5432/kumbh_tent?sslmode=disable}
      - JWT_SECRET=${JWT_SECRET:-dev-only-insecure-secret}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # ── Tent Service ──────────────────────────────────────
  tent-service:
    build:
      context: .
      dockerfile: tent-service/Dockerfile
    container_name: kumbh_tents
    ports:
      - "0.0.0.0:8082:8082"
    environment:
      - TENT_SERVICE_PORT=8082
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:password@postgres:5432/kumbh_tent?sslmode=disable}
      - JWT_SECRET=${JWT_SECRET:-dev-only-insecure-secret}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # ── Booking Service ──────────────────────────────────
  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: kumbh_bookings
    ports:
      - "0.0.0.0:8083:8083"
    environment:
      - BOOKING_SERVICE_PORT=8083
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:password@postgres:5432/kumbh_tent?sslmode=disable}
      - JWT_SECRET=${JWT_SECRET:-dev-only-insecure-secret}
      - FIREBASE_SERVICE_ACCOUNT=/app/firebase-service-account.json
      # Booking service issues refunds, so it needs Razorpay
      # credentials too — not just payment-service.
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      # ── Refund policy ────────────────────────────────
      # Empty REFUND_TIERS = 100% refund at any notice.
      # See .env.example for the T&C-matching alternative.
      - REFUND_ENABLED=${REFUND_ENABLED:-true}
      # Cancellations create a refund REQUEST; staff approve it
      # in the admin panel before any money moves.
      - REFUND_REQUIRE_APPROVAL=${REFUND_REQUIRE_APPROVAL:-true}
      - REFUND_TIERS=${REFUND_TIERS:-}
      - REFUND_FEE_PERCENT=${REFUND_FEE_PERCENT:-0}
      - REFUND_SETTLEMENT_DAYS=${REFUND_SETTLEMENT_DAYS:-3-4}
      - REFUND_MAX_ATTEMPTS=${REFUND_MAX_ATTEMPTS:-6}
      - REFUND_RETRY_INTERVAL_MINUTES=${REFUND_RETRY_INTERVAL_MINUTES:-15}
      - RAZORPAY_REFUND_SPEED=${RAZORPAY_REFUND_SPEED:-normal}
      # ── Booking confirmation email ───────────────────
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Kumbh Tent Booking}
    volumes:
      - ./booking-service/firebase-service-account.json:/app/firebase-service-account.json
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # ── Payment Service ──────────────────────────────────
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: kumbh_payments
    ports:
      - "0.0.0.0:8084:8084"
    environment:
      - PAYMENT_SERVICE_PORT=8084
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:password@postgres:5432/kumbh_tent?sslmode=disable}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-dev-only-insecure-secret}
      - FIREBASE_SERVICE_ACCOUNT=/app/firebase-service-account.json
      # ── Booking confirmation email ───────────────────
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Kumbh Tent Booking}
    volumes:
      - ./payment-service/firebase-service-account.json:/app/firebase-service-account.json
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

volumes:
  postgres_data: