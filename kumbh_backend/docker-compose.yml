# ============================================================
# PRODUCTION compose file — this is what Elastic Beanstalk deploys.
#
# Every service here pulls a pre-built image from ECR instead of
# building from source on the instance. A cold instance building 5
# Go services from scratch (go mod download + go build x5) was
# observed taking 30-60+ minutes and repeatedly timing out/hanging
# EB deploys (2026-09-02 incident). Pulling a ready image takes
# seconds instead.
#
# Build and push new images with scripts/build-and-push.sh (or .ps1)
# before deploying a code change — `eb deploy` alone does NOT
# rebuild these images, it only picks up this compose file and
# whatever image tag it points at.
#
# For local development with live source (docker compose build),
# use docker-compose.dev.yml instead — that one still has `build:`
# contexts and the local Postgres container.
#
# This same file is shared across multiple EB environments in
# DIFFERENT AWS accounts (discovered 2026-09-08: bharat-tent-api-alb
# in one account, bharat-tent-api-prod — the real production — in
# another). Each account has its own ECR registry, so the registry
# host is parameterized via $ECR_REGISTRY rather than hardcoded.
# Default (below) is the first account; bharat-tent-api-prod has
# ECR_REGISTRY set as an environment property overriding it to its
# own account's registry — see scripts/build-and-push.sh.
# ============================================================

services:

  # ── API Gateway ──────────────────────────────────────
  api-gateway:
    image: ${ECR_REGISTRY:-821279529027.dkr.ecr.ap-south-1.amazonaws.com}/bharat-tent/api-gateway:latest
    container_name: kumbh_gateway
    ports:
      - "0.0.0.0:${GATEWAY_PORT:-8085}:8080"
    environment:
      - API_GATEWAY_PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:8081
      - TENT_SERVICE_URL=http://tent-service:8082
      - BOOKING_SERVICE_URL=http://booking-service:8083
      - PAYMENT_SERVICE_URL=http://payment-service:8084
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      - auth-service
      - tent-service
      - booking-service
      - payment-service
    restart: unless-stopped

  # ── Auth Service ──────────────────────────────────────
  auth-service:
    image: ${ECR_REGISTRY:-821279529027.dkr.ecr.ap-south-1.amazonaws.com}/bharat-tent/auth-service:latest
    container_name: kumbh_auth
    ports:
      - "0.0.0.0:8081:8081"
    environment:
      - AUTH_SERVICE_PORT=8081
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    restart: unless-stopped

  # ── Tent Service ──────────────────────────────────────
  tent-service:
    image: ${ECR_REGISTRY:-821279529027.dkr.ecr.ap-south-1.amazonaws.com}/bharat-tent/tent-service:latest
    container_name: kumbh_tents
    ports:
      - "0.0.0.0:8082:8082"
    environment:
      - TENT_SERVICE_PORT=8082
      - DATABASE_URL=${DATABASE_URL}
      # tent-service/main.go requireEnv()'s this too (Phase 1 security
      # hardening) - it was missed here, so tent-service crash-looped
      # with "FATAL: required env var(s) not set: JWT_SECRET" the
      # first time this compose file's images were actually redeployed.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    restart: unless-stopped

  # ── Booking Service ──────────────────────────────────
  booking-service:
    image: ${ECR_REGISTRY:-821279529027.dkr.ecr.ap-south-1.amazonaws.com}/bharat-tent/booking-service:latest
    container_name: kumbh_bookings
    ports:
      - "0.0.0.0:8083:8083"
    environment:
      - BOOKING_SERVICE_PORT=8083
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - FIREBASE_SERVICE_ACCOUNT=/app/firebase-service-account.json
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:?RAZORPAY_KEY_ID must be set}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:?RAZORPAY_KEY_SECRET must be set}
      - REFUND_ENABLED=${REFUND_ENABLED:-true}
      - REFUND_REQUIRE_APPROVAL=${REFUND_REQUIRE_APPROVAL:-true}
      - REFUND_TIERS=${REFUND_TIERS:-}
      - REFUND_FEE_PERCENT=${REFUND_FEE_PERCENT:-0}
      - REFUND_SETTLEMENT_DAYS=${REFUND_SETTLEMENT_DAYS:-3-4}
      - REFUND_MAX_ATTEMPTS=${REFUND_MAX_ATTEMPTS:-6}
      - REFUND_RETRY_INTERVAL_MINUTES=${REFUND_RETRY_INTERVAL_MINUTES:-15}
      - RAZORPAY_REFUND_SPEED=${RAZORPAY_REFUND_SPEED:-normal}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Kumbh Tent Booking}
    volumes:
      - ./booking-service/firebase-service-account.json:/app/firebase-service-account.json
    restart: unless-stopped

  # ── Payment Service ──────────────────────────────────
  payment-service:
    image: ${ECR_REGISTRY:-821279529027.dkr.ecr.ap-south-1.amazonaws.com}/bharat-tent/payment-service:latest
    container_name: kumbh_payments
    ports:
      - "0.0.0.0:8084:8084"
    environment:
      - PAYMENT_SERVICE_PORT=8084
      - DATABASE_URL=${DATABASE_URL}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:?RAZORPAY_KEY_ID must be set}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:?RAZORPAY_KEY_SECRET must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - FIREBASE_SERVICE_ACCOUNT=/app/firebase-service-account.json
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Kumbh Tent Booking}
    volumes:
      - ./payment-service/firebase-service-account.json:/app/firebase-service-account.json
    restart: unless-stopped
