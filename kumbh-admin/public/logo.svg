<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c842;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8a020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c97f10;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon background circle -->
  <circle cx="36" cy="36" r="32" fill="url(#iconGrad)" />
  <circle cx="36" cy="36" r="30" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" />

  <!-- Capsule tent shape icon -->
  <!-- Main capsule body -->
  <rect x="14" y="30" width="44" height="18" rx="9" ry="9" fill="url(#goldGrad)" />
  <!-- Tent roof arc -->
  <path d="M 18 30 Q 36 10 54 30" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Window -->
  <rect x="26" y="32" width="20" height="12" rx="3" fill="#1a1a1a" opacity="0.7"/>
  <!-- Window warm glow -->
  <rect x="27" y="33" width="18" height="10" rx="2.5" fill="#f5c842" opacity="0.3"/>
  <!-- Steps -->
  <rect x="32" y="48" width="8" height="2" rx="1" fill="url(#goldGrad)" opacity="0.8"/>
  <rect x="34" y="50" width="4" height="2" rx="1" fill="url(#goldGrad)" opacity="0.6"/>
  <!-- Stars -->
  <circle cx="20" cy="18" r="1" fill="#f5c842" opacity="0.8" filter="url(#glow)"/>
  <circle cx="36" cy="13" r="1.2" fill="#f5c842" opacity="0.9" filter="url(#glow)"/>
  <circle cx="52" cy="18" r="1" fill="#f5c842" opacity="0.8" filter="url(#glow)"/>

  <!-- Text: Kumbh -->
  <text x="84" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" letter-spacing="2" fill="#1a1a1a">KUMBH</text>
  <!-- Gold underline accent -->
  <rect x="84" y="36" width="110" height="1.5" rx="1" fill="url(#goldGrad)" opacity="0.6"/>
  <!-- Text: TENT -->
  <text x="86" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" letter-spacing="8" fill="url(#goldGrad)">TENT</text>

  <!-- Tagline -->
  <text x="84" y="68" font-family="Arial, sans-serif" font-size="7.5" letter-spacing="2.5" fill="#888" font-weight="500">PREMIUM CAPSULE STAYS</text>
</svg>
